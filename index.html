<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Group Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <style>
        [v-cloak] { display: none; }
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        /* Анимация появления значка */
        .badge-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="app" v-cloak class="max-w-md mx-auto p-4 space-y-4">
        
        <div class="bg-white p-8 rounded-[2.5rem] text-center border border-gray-100 custom-shadow">
            <h2 class="font-bold text-xl mb-2 text-slate-800">Иманкулов Санжар</h2>
            
            <div class="flex flex-wrap justify-center gap-2 mb-4 min-h-[32px]">
                <div v-for="badge in earnedBadges" :key="badge.id" 
                     class="badge-pop flex items-center bg-indigo-50 border border-indigo-100 px-2 py-1 rounded-full shadow-sm"
                     :title="badge.desc">
                    <span class="text-sm mr-1">{{ badge.icon }}</span>
                    <span class="text-[10px] font-bold text-indigo-600 uppercase">{{ badge.name }}</span>
                </div>
            </div>
            
            <div class="flex items-center justify-center gap-3 text-blue-500 text-4xl font-bold my-6">
                <span>⏱</span>
                <span>{{ formattedTime }}</span>
            </div>
            
            <button @click="stopSession" class="w-full bg-[#f43f5e] text-white py-4 rounded-2xl font-bold mb-3 active:scale-95 transition-all shadow-sm">
                ⛔ Завершить сессию
            </button>
            
            <div class="grid grid-cols-2 gap-3">
                <button @click="myStatus = 'break'" class="bg-[#fbbf24] text-white py-4 rounded-2xl font-bold active:scale-95 transition-all">
                    ☕ Перерыв
                </button>
                <button @click="myStatus = 'online'" class="bg-[#64748b] text-white py-4 rounded-2xl font-bold active:scale-95 transition-all">
                    Вход
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] border border-gray-100 custom-shadow">
            <div class="flex items-center gap-2 font-bold mb-4 justify-between text-indigo-900 uppercase tracking-wider text-xs">
                <span>🏆 ТОП СТУДЕНТОВ (СЕГОДНЯ)</span>
            </div>
            <div class="space-y-3">
                <div v-for="(user, index) in sortedLeaderboard" :key="user.name" 
                     class="flex justify-between items-center p-2 rounded-xl"
                     :class="user.isMe ? 'bg-blue-50 ring-1 ring-blue-100' : ''">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full bg-slate-100 text-slate-500">{{ index + 1 }}</span>
                        <span class="text-sm font-bold text-slate-700">{{ user.name }}</span>
                    </div>
                    <span class="text-xs font-mono font-bold text-blue-600">{{ formatSpecificTime(user.time) }}</span>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] border border-gray-100 custom-shadow">
            <div class="flex items-center gap-2 font-bold mb-6 justify-center text-indigo-900 uppercase tracking-wider text-sm">
                <span>👥 Монитор группы</span>
            </div>
            
            <div class="space-y-6">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <span :class="myStatus === 'online' ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.5)]' : 'bg-gray-400'" class="w-3 h-3 rounded-full"></span>
                        <span class="font-bold text-slate-700 text-lg">Санжар (Вы)</span>
                    </div>
                    <div class="text-right">
                        <div class="text-gray-400 text-[11px]">🏠 Дома</div>
                        <div class="text-blue-400 font-mono text-xs font-bold">{{ formattedTime }}</div>
                    </div>
                </div>

                <div class="flex justify-between items-center opacity-90">
                    <div class="flex items-center gap-3">
                        <span class="bg-green-500 w-3 h-3 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.5)]"></span>
                        <span class="font-bold text-slate-700 text-lg">Almas</span>
                    </div>
                    <div class="text-right">
                        <div class="text-gray-400 text-[11px]">🏫 В колледже</div>
                        <div class="text-blue-400 font-mono text-xs font-bold">1ч 12м 05с</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] border border-gray-100 custom-shadow">
            <div class="flex items-center gap-2 font-bold mb-4 justify-center text-indigo-900 uppercase tracking-wider text-sm">
                <span>💬 Общий чат</span>
            </div>
            
            <div id="chat-box" class="bg-slate-50 rounded-3xl p-5 h-64 overflow-y-auto mb-4 space-y-4 border border-slate-100">
                <div v-for="msg in chatHistory" :key="msg.id" :class="['flex flex-col', msg.user === 'САНЖАР' ? 'items-end' : '']">
                    <span class="text-[10px] font-bold uppercase ml-1" :class="msg.user === 'САНЖАР' ? 'text-emerald-500 mr-1' : 'text-indigo-500'">{{ msg.user }}</span>
                    <div :class="[
                        'p-3 rounded-2xl shadow-sm inline-block max-w-[90%]',
                        msg.user === 'САНЖАР' ? 'bg-emerald-500 text-white rounded-tr-none' : 'bg-white border border-gray-100 rounded-tl-none'
                    ]">
                        {{ msg.text }}
                    </div>
                </div>
            </div>

            <div class="flex gap-2">
                <input v-model="newMessage" @keyup.enter="send" type="text" placeholder="Написать сообщение..." 
                    class="flex-1 bg-slate-50 border-none rounded-2xl px-5 py-4 outline-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-500 transition-all text-sm">
                <button @click="send" class="bg-[#10b981] text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-200 active:scale-90 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const seconds = ref(0);
                const myStatus = ref('online');
                const newMessage = ref('');
                const messageCount = ref(0);
                
                // Данные для рейтинга (заглушки)
                const students = ref([
                    { name: 'Almas', time: 4325, isMe: false },
                    { name: 'Sanzhar K.', time: 1200, isMe: false },
                    { name: 'Aruzhan', time: 5400, isMe: false }
                ]);

                // Чат
                const chatHistory = ref([
                    { id: 1, user: 'ALMAS', text: 'Всем привет! Я уже в колледже.' }
                ]);

                // Система достижений
                const earnedBadges = ref([]);
                const badgesLibrary = {
                    early: { name: 'Пташка', icon: '🌅', desc: 'Зашел до 8:00' },
                    marathon: { name: 'Марафонец', icon: '🏃', desc: 'Проучился более 2 часов' },
                    activist: { name: 'Активист', icon: '🔥', desc: 'Написал более 5 сообщений' }
                };

                // Проверка достижений
                const checkAchievements = () => {
                    // 1. Ранняя пташка
                    const hour = new Date().getHours();
                    if (hour < 8 && !earnedBadges.value.some(b => b.id === 'early')) {
                        earnedBadges.value.push({ id: 'early', ...badgesLibrary.early });
                    }
                    // 2. Марафонец (2 часа = 7200 сек)
                    if (seconds.value >= 7200 && !earnedBadges.value.some(b => b.id === 'marathon')) {
                        earnedBadges.value.push({ id: 'marathon', ...badgesLibrary.marathon });
                    }
                    // 3. Активист
                    if (messageCount.value >= 5 && !earnedBadges.value.some(b => b.id === 'activist')) {
                        earnedBadges.value.push({ id: 'activist', ...badgesLibrary.activist });
                    }
                };

                // Таймер
                setInterval(() => {
                    if (myStatus.value === 'online') {
                        seconds.value++;
                        checkAchievements();
                    }
                }, 1000);

                // Форматирование времени
                const formatSpecificTime = (s) => {
                    const h = Math.floor(s / 3600);
                    const m = Math.floor((s % 3600) / 60);
                    const sec = s % 60;
                    return `${h}ч ${m}м ${sec}с`;
                };

                const formattedTime = computed(() => formatSpecificTime(seconds.value));

                // Сортировка рейтинга
                const sortedLeaderboard = computed(() => {
                    const list = [...students.value, { name: 'Санжар', time: seconds.value, isMe: true }];
                    return list.sort((a, b) => b.time - a.time);
                });

                const send = () => {
                    if (!newMessage.value.trim()) return;
                    chatHistory.value.push({
                        id: Date.now(),
                        user: 'САНЖАР',
                        text: newMessage.value
                    });
                    newMessage.value = '';
                    messageCount.value++;
                    checkAchievements();
                    
                    setTimeout(() => {
                        const box = document.getElementById('chat-box');
                        box.scrollTop = box.scrollHeight;
                    }, 50);
                };

                return { 
                    seconds, formattedTime, myStatus, newMessage, chatHistory, 
                    send, sortedLeaderboard, formatSpecificTime, earnedBadges 
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
