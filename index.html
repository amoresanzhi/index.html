<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Group Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <style>
        [v-cloak] { display: none; }
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .badge-anim { animation: bounce 0.5s ease; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
</head>
<body>

    <div id="app" v-cloak class="max-w-md mx-auto p-4 space-y-4">
        
        <div class="bg-white p-8 rounded-[2.5rem] text-center border border-gray-100 custom-shadow">
            <h2 class="font-bold text-xl mb-2 text-slate-800">Иманкулов Санжар</h2>
            
            <div class="flex justify-center gap-2 mb-4 h-8">
                <span v-for="badge in myBadges" :key="badge.id" 
                      :title="badge.description"
                      class="badge-anim bg-indigo-100 text-indigo-600 text-[10px] px-2 py-1 rounded-full font-bold border border-indigo-200">
                    {{ badge.icon }} {{ badge.name }}
                </span>
            </div>
            
            <div class="flex items-center justify-center gap-3 text-blue-500 text-4xl font-bold my-6">
                <span>⏱</span>
                <span>{{ formattedTime }}</span>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button @click="myStatus = 'break'" class="bg-[#fbbf24] text-white py-4 rounded-2xl font-bold active:scale-95 transition-all">☕ Перерыв</button>
                <button @click="myStatus = 'online'" class="bg-[#64748b] text-white py-4 rounded-2xl font-bold active:scale-95 transition-all">Вход</button>
                <button @click="myStatus = 'offline'" class="col-span-2 bg-[#f43f5e] text-white py-4 rounded-2xl font-bold active:scale-95 transition-all shadow-sm">⛔ Завершить сессию</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] border border-gray-100 custom-shadow">
            <div class="flex items-center gap-2 font-bold mb-4 justify-center text-indigo-900 uppercase tracking-wider text-sm">
                <span>🏆 Топ студентов (по времени)</span>
            </div>
            <div class="space-y-3">
                <div v-for="(user, index) in sortedUsers" :key="user.name" 
                     class="flex justify-between items-center p-3 rounded-2xl transition-all"
                     :class="user.isMe ? 'bg-indigo-50 border border-indigo-100' : ''">
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-slate-400 w-4">{{ index + 1 }}</span>
                        <span class="font-bold text-slate-700">{{ user.name }} {{ user.isMe ? '(Вы)' : '' }}</span>
                    </div>
                    <span class="font-mono font-bold text-indigo-600 text-sm">{{ formatAnyTime(user.time) }}</span>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] border border-gray-100 custom-shadow">
            <div class="flex items-center gap-2 font-bold mb-6 justify-center text-indigo-900 uppercase tracking-wider text-sm">
                <span>👥 Монитор группы</span>
            </div>
            <div class="space-y-6">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <span :class="myStatus === 'online' ? 'bg-green-500' : 'bg-gray-400'" class="w-3 h-3 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.5)]"></span>
                        <span class="font-bold text-slate-700 text-lg">Санжар (Вы)</span>
                    </div>
                    <div class="text-right">
                        <div class="text-gray-400 text-[11px]">🏠 Дома</div>
                        <div class="text-blue-400 font-mono text-xs font-bold">{{ formattedTime }}</div>
                    </div>
                </div>
                </div>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] border border-gray-100 custom-shadow">
             <div id="chat-box" class="bg-slate-50 rounded-3xl p-5 h-64 overflow-y-auto mb-4 space-y-4 border border-slate-100">
                <div v-for="msg in messages" :key="msg.id" :class="msg.isMe ? 'flex flex-col items-end' : 'flex flex-col'">
                    <span class="text-[10px] font-bold uppercase ml-1" :class="msg.isMe ? 'text-emerald-500 mr-1' : 'text-indigo-500'">{{ msg.user }}</span>
                    <div :class="msg.isMe ? 'bg-emerald-500 text-white rounded-tr-none' : 'bg-white shadow-sm border border-gray-100 rounded-tl-none'" class="p-3 rounded-2xl inline-block max-w-[90%]">
                        {{ msg.text }}
                    </div>
                </div>
            </div>

            <div class="flex gap-2">
                <input v-model="newMessage" @keyup.enter="send" type="text" placeholder="Написать сообщение..." class="flex-1 bg-slate-50 border-none rounded-2xl px-5 py-4 outline-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-500 transition-all">
                <button @click="send" class="bg-[#10b981] text-white w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-200 active:scale-90 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" /></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, watch } = Vue;

        createApp({
            setup() {
                const seconds = ref(55);
                const myStatus = ref('online');
                const newMessage = ref('');
                const messageCount = ref(0);
                const myBadges = ref([]);
                
                // Статические данные других студентов
                const users = ref([
                    { name: 'Almas', time: 4325, isMe: false },
                    { name: 'Sanzhar (Other)', time: 0, isMe: false },
                    { name: 'Санжар', time: seconds, isMe: true }
                ]);

                const messages = ref([
                    { id: 1, user: 'ALMAS', text: 'Всем привет! Я уже в колледже. 🏫', isMe: false },
                ]);

                // 1. ЛОГИКА ДОСТИЖЕНИЙ
                const checkBadges = () => {
                    // Ранняя пташка (если зашел до 8:00 - эмулируем проверку текущего часа)
                    const currentHour = new Date().getHours();
                    if (currentHour < 8 && !myBadges.value.find(b => b.id === 'early')) {
                        myBadges.value.push({ id: 'early', name: 'Пташка', icon: '🌅', description: 'Зашел до 8 утра' });
                    }

                    // Марафонец (более 2 часов = 7200 секунд)
                    if (seconds.value >= 7200 && !myBadges.value.find(b => b.id === 'marathon')) {
                        myBadges.value.push({ id: 'marathon', name: 'Марафонец', icon: '🏃', description: 'Проучился более 2 часов' });
                    }

                    // Активист (20 сообщений)
                    if (messageCount.value >= 20 && !myBadges.value.find(b => b.id === 'activist')) {
                        myBadges.value.push({ id: 'activist', name: 'Активист', icon: '🔥', description: 'Написал 20 сообщений' });
                    }
                };

                // Живой таймер
                setInterval(() => {
                    if (myStatus.value === 'online') {
                        seconds.value++;
                        checkBadges(); // Проверяем ачивки каждую секунду
                    }
                }, 1000);

                // 2. ЛОГИКА РЕЙТИНГА
                const sortedUsers = computed(() => {
                    return [...users.value].sort((a, b) => b.time - a.time);
                });

                const formatAnyTime = (s) => {
                    const h = Math.floor(s / 3600);
                    const m = Math.floor((s % 3600) / 60);
                    const sec = s % 60;
                    return `${h}ч ${m}м ${sec}с`;
                };

                const formattedTime = computed(() => formatAnyTime(seconds.value));

                const send = () => {
                    if (!newMessage.value.trim()) return;
                    messages.value.push({
                        id: Date.now(),
                        user: 'САНЖАР',
                        text: newMessage.value,
                        isMe: true
                    });
                    
                    messageCount.value++; // Увеличиваем счетчик для ачивки
                    newMessage.value = '';
                    
                    setTimeout(() => {
                        const box = document.getElementById('chat-box');
                        box.scrollTop = box.scrollHeight;
                    }, 50);
                };

                return { 
                    seconds, formattedTime, myStatus, newMessage, 
                    messages, send, sortedUsers, formatAnyTime, myBadges 
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
