<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <style>[v-cloak] { display: none; }</style>
</head>
<body class="bg-slate-100">

    <div id="app" v-cloak class="max-w-md mx-auto p-4 space-y-4">
        
        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm text-center border border-gray-50">
            <h2 class="font-bold text-xl mb-4">Иманкулов Санжар</h2>
            <div class="flex items-center justify-center gap-3 text-blue-500 text-4xl font-bold my-6">
                <span>⏱</span> <span>{{ formattedTime }}</span>
            </div>
            <button @click="isOnline = false" class="w-full bg-[#f43f5e] text-white py-4 rounded-2xl font-bold mb-3 shadow-md">⛔ Завершить сессию</button>
            <div class="grid grid-cols-2 gap-3">
                <button @click="isOnline = false" class="bg-[#fbbf24] text-white py-4 rounded-2xl font-bold">☕ Перерыв</button>
                <button @click="isOnline = true" class="bg-[#64748b] text-white py-4 rounded-2xl font-bold">Вход</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-50 text-center">
            <div class="font-bold text-indigo-900 mb-4">👥 Монитор группы</div>
            <div class="flex justify-between items-center px-4">
                <div class="flex items-center gap-2">
                    <span :class="isOnline ? 'bg-green-500' : 'bg-gray-400'" class="w-3 h-3 rounded-full transition-all"></span>
                    <span class="font-bold">Sanzhar</span>
                </div>
                <div class="text-right text-[10px] text-gray-400">🏠 Дома <br> <span class="text-blue-400 font-bold">0ч 0м 0с</span></div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-50">
            <div class="font-bold text-indigo-900 mb-4 text-center">💬 Общий чат</div>
            
            <div id="chat-box" class="bg-gray-50 rounded-3xl p-4 h-64 overflow-y-auto mb-4 space-y-2 border border-gray-100">
                <div v-for="msg in messages" :key="msg.id" class="text-sm">
                    <span class="font-bold text-gray-800">{{ msg.user_name }}:</span> 
                    <span class="text-gray-600">{{ msg.text }}</span>
                </div>
                <div v-if="messages.length === 0" class="text-center text-gray-300 mt-10 text-xs">Нет сообщений. Напишите первым!</div>
            </div>

            <div class="flex gap-2">
                <input v-model="newMessage" @keyup.enter="send" type="text" placeholder="Сообщение..." class="flex-1 bg-gray-50 rounded-2xl px-4 py-3 outline-none ring-1 ring-gray-200 focus:ring-2 focus:ring-emerald-500">
                <button @click="send" class="bg-[#10b981] text-white w-12 h-12 rounded-2xl flex items-center justify-center">➤</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const { createApp, ref, onMounted, computed } = Vue;
            
            const SB_URL = 'https://vzzyjiohgmfdabziruow.supabase.co';
            const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6enlqaW9oZ21mZGFiemlydW93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMDkxMjAsImV4cCI6MjA5MDU4NTEyMH0.SeJ6mqMrPwGMHVEe7nSBxxWeWO_NF0ArOSP4OlP4ZOM';

            const client = supabase.createClient(SB_URL, SB_KEY);

            createApp({
                setup() {
                    const seconds = ref(0);
                    const isOnline = ref(true);
                    const messages = ref([]);
                    const newMessage = ref('');

                    setInterval(() => { if(isOnline.value) seconds.value++; }, 1000);
                    const formattedTime = computed(() => `${seconds.value} сек.`);

                    const load = async () => {
                        const { data, error } = await client.from('messages').select('*').order('created_at', { ascending: true });
                        if (data) messages.value = data;
                        if (error) console.error("Ошибка загрузки:", error.message);
                    };

                    const send = async () => {
                        if (!newMessage.value.trim()) return;
                        const m = newMessage.value;
                        newMessage.value = '';
                        const { error } = await client.from('messages').insert([{ user_name: 'Санжар', text: m }]);
                        if (error) {
                            alert("Ошибка отправки! Проверь RLS политики в Supabase.");
                            console.error(error);
                        }
                    };

                    onMounted(() => {
                        load();
                        client.channel('any').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
                            messages.value.push(p.new);
                        }).subscribe();
                    });

                    return { seconds, isOnline, formattedTime, messages, newMessage, send };
                }
            }).mount('#app');
        };
    </script>
</body>
</html>
