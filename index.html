<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-100 font-sans">
    <div id="app" class="max-w-md mx-auto p-4 space-y-4 shadow-lg">
        
        <div class="bg-white p-6 rounded-[2rem] text-center shadow-sm border border-gray-100">
            <h2 class="font-bold text-lg mb-4 text-gray-800">Иманкулов Санжар</h2>
            <div class="flex items-center justify-center gap-2 text-blue-500 text-3xl font-bold mb-6">
                <span>⏱</span> <span>{{ formattedTime }}</span>
            </div>
            
            <button class="w-full bg-[#ef4444] text-white py-3 rounded-2xl font-bold mb-3 shadow-md active:scale-95 transition-transform">
                ⛔ Завершить сессию
            </button>
            
            <div class="grid grid-cols-2 gap-3">
                <button class="bg-[#f59e0b] text-white py-3 rounded-2xl font-bold active:scale-95 transition-transform">
                    ☕ Перерыв
                </button>
                <button class="bg-[#64748b] text-white py-3 rounded-2xl font-bold active:scale-95 transition-transform">
                    Выход
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
            <div class="flex items-center gap-2 font-bold mb-4 justify-center text-indigo-900">
                <span>👥</span> Монитор группы
            </div>
            <div class="flex justify-between items-center text-sm">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-gray-400 rounded-full"></span>
                    <span class="font-bold">Sanzhar</span>
                </div>
                <div class="text-right">
                    <div class="text-gray-500 text-[10px] flex items-center gap-1 justify-end">🏠 Дома</div>
                    <div class="text-blue-400 font-mono text-xs font-bold">0ч 0м 0с</div>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100">
            <div class="flex items-center gap-2 font-bold mb-4 justify-center text-indigo-900">
                <span>💬</span> Общий чат
            </div>
            
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4 h-48 overflow-y-auto mb-4 text-sm space-y-3">
                <div v-for="msg in messages" :key="msg.id">
                    <span class="font-extrabold text-gray-800">{{ msg.user_name }}:</span> 
                    <span class="text-gray-600">{{ msg.text }}</span>
                </div>
            </div>

            <div class="flex gap-2">
                <input v-model="newMessage" @keyup.enter="sendMessage" type="text" placeholder="Сообщение..." 
                    class="flex-1 border border-gray-200 rounded-2xl px-4 py-2 focus:outline-none focus:border-emerald-500 bg-gray-50">
                <button @click="sendMessage" class="bg-[#10b981] text-white p-3 rounded-xl hover:bg-emerald-600">
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
    window.onload = function() {
        const { createApp, ref, onMounted, computed } = Vue;
        
        // --- ПРОВЕРЬ ССЫЛКИ ЕЩЕ РАЗ ---
        const SUPABASE_URL = 'https://vzzyjiohgmfdabziruow.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6enlqaW9oZ21mZGFiemlydW93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMDkxMjAsImV4cCI6MjA5MDU4NTEyMH0.SeJ6mqMrPwGMHVEe7nSBxxWeWO_NF0ArOSP4OlP4ZOM';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        createApp({
            setup() {
                const seconds = ref(0);
                const messages = ref([]);
                const newMessage = ref('');
                const userName = 'Sanzhar';
                const isOnline = ref(true); // Состояние индикатора

                // Таймер
                setInterval(() => { seconds.value++; }, 1000);
                const formattedTime = computed(() => `${seconds.value} сек.`);

                // 1. Функция отправки сообщения
                const sendMessage = async () => {
                    if (!newMessage.value.trim()) return;
                    const text = newMessage.value;
                    newMessage.value = ''; 

                    const { error } = await supabaseClient
                        .from('messages')
                        .insert([{ user_name: userName, text: text }]);
                    
                    if (error) console.error("Ошибка чата:", error.message);
                };

                // 2. Функции кнопок
                const stopSession = () => {
                    isOnline.value = false;
                    alert("Сессия завершена!");
                };

                const toggleBreak = () => {
                    alert("Перерыв начат");
                };

                const fetchMessages = async () => {
                    const { data } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true });
                    if (data) messages.value = data;
                };

                onMounted(() => {
                    fetchMessages();
                    supabaseClient
                        .channel('any')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                            messages.value.push(payload.new);
                        })
                        .subscribe();
                });

                return { 
                    seconds, formattedTime, messages, newMessage, 
                    sendMessage, stopSession, toggleBreak, isOnline 
                };
            }
        }).mount('#app');
    };
</script>
</body>
</html>
