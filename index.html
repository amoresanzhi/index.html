<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Almas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto p-4 space-y-4">
        
        <div class="bg-white p-6 rounded-3xl shadow-sm text-center border border-gray-100">
            <h2 class="font-bold text-xl mb-4">Дүйсенбек Алмас Әлфарабиұлы</h2>
            <div class="flex items-center justify-center gap-2 text-blue-600 text-3xl font-bold mb-6">
                <span>⏱</span> <span>{{ formattedTime }}</span>
            </div>
            
            <button @click="stopSession" class="w-full bg-[#e63946] text-white py-3 rounded-xl font-semibold mb-3 flex items-center justify-center gap-2">
                <span class="text-xl">⛔</span> Завершить сессию
            </button>
            
            <div class="grid grid-cols-2 gap-3">
                <button @click="toggleBreak" class="bg-[#ffb703] text-black py-3 rounded-xl font-semibold flex items-center justify-center gap-2">
                    ☕ Перерыв
                </button>
                <button @click="exit" class="bg-[#6c757d] text-white py-3 rounded-xl font-semibold">
                    Выход
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-2 font-bold mb-4 justify-center">
                <span>👥</span> Монитор группы
            </div>
            <div class="flex justify-between items-center text-sm">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-gray-400 rounded-full"></span>
                    <span class="font-bold">Sanzhar</span>
                </div>
                <div class="text-right text-blue-500">
                    <div class="text-gray-500 text-xs flex items-center gap-1 justify-end">🏠 Дома</div>
                    <div class="font-mono">0ч 0м 0с</div>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-2 font-bold mb-4 justify-center">
                <span>💬</span> Общий чат
            </div>
            
            <div class="bg-gray-50 border rounded-xl p-3 h-48 overflow-y-auto mb-4 text-sm space-y-2">
                <div v-for="msg in messages" :key="msg.id">
                    <span class="font-bold">{{ msg.user_name }}:</span> {{ msg.text }}
                </div>
            </div>

            <div class="flex gap-2">
                <input v-model="newMessage" @keyup.enter="sendMessage" type="text" placeholder="Сообщение..." class="flex-1 border rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <button @click="sendMessage" class="bg-[#2a9d8f] text-white p-3 rounded-xl hover:opacity-90">
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed } = Vue;
        
        // --- ВСТАВЬ СВОИ ДАННЫЕ СЮДА ---
        const SUPABASE_URL = 'https://vzzyjiohgmfdabziruow.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6enlqaW9oZ21mZGFiemlydW93Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMDkxMjAsImV4cCI6MjA5MDU4NTEyMH0.SeJ6mqMrPwGMHVEe7nSBxxWeWO_NF0ArOSP4OlP4ZOM';
        // ------------------------------

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        createApp({
            setup() {
                const seconds = ref(37);
                const messages = ref([]);
                const newMessage = ref('');
                const userName = 'Иманкулов Санжар';

                // Таймер
                setInterval(() => seconds.value++, 1000);
                const formattedTime = computed(() => `${seconds.value} сек.`);

                // Загрузка сообщений
                const fetchMessages = async () => {
                    const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
                    messages.value = data || [];
                };

                // Отправка сообщения
                const sendMessage = async () => {
                    if (!newMessage.value.trim()) return;
                    await supabase.from('messages').insert([{ user_name: userName, text: newMessage.value }]);
                    newMessage.value = '';
                };

                // Подписка на обновления в реальном времени
                onMounted(() => {
                    fetchMessages();
                    supabase.channel('custom-all-channel')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                        messages.value.push(payload.new);
                    })
                    .subscribe();
                });

                return { seconds, formattedTime, messages, newMessage, sendMessage };
            }
        }).mount('#app');
    </script>
</body>
</html>
